name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (CGO_ENABLED=0)
        run: go build ./...

      - name: Build pinned dependencies
        run: go build -tags tools ./internal/deps/

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        env:
          CGO_ENABLED: "1" # the race detector needs cgo
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Compilado con el Go de setup-go: un binario publicado con un Go
          # anterior al del go.mod se niega a analizar el módulo.
          version: v2.15.0
          install-mode: goinstall
          args: --timeout=5m

  release-snapshot:
    name: cross-compile (goreleaser snapshot)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

  desktop:
    # adesc-desktop (Wails v2, its own Go module in cmd/adesc-desktop). Needs
    # cgo and the native webview, so each OS builds on its own runner:
    # NSIS installer on Windows, universal .app + .dmg on macOS, .deb and
    # AppImage on Linux (WebKitGTK 4.1), plus an xvfb-run smoke test that
    # starts the app and checks the integrated API answers.
    name: desktop (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            tags: webkit2_41
          - os: windows-latest
            platform: windows/amd64
            tags: ""
          - os: macos-latest
            platform: darwin/universal
            tags: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
      WAILS_VERSION: v2.17.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/adesc-desktop/go.mod
          cache-dependency-path: cmd/adesc-desktop/go.sum

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus dbus-x11

      - name: NSIS
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
          fi
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version
        id: version
        run: |
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "pkg=0.0.0+ci${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Vet and test (desktop module)
        working-directory: cmd/adesc-desktop
        run: |
          tags=desktop,production
          if [ -n "${{ matrix.tags }}" ]; then tags="$tags,${{ matrix.tags }}"; fi
          go vet -tags "$tags" ./...
          go test -race -count=1 -tags "$tags" ./...

      - name: wails build
        working-directory: cmd/adesc-desktop
        run: |
          extra=()
          # NSIS installer that installs the WebView2 runtime when missing.
          if [ "${{ runner.os }}" = "Windows" ]; then extra+=(-nsis -webview2 download); fi
          if [ -n "${{ matrix.tags }}" ]; then extra+=(-tags "${{ matrix.tags }}"); fi
          wails build -clean -trimpath -s -skipbindings \
            -platform "${{ matrix.platform }}" "${extra[@]}" \
            -ldflags "-X admindescargas/internal/buildinfo.Version=${{ steps.version.outputs.version }} -X admindescargas/internal/buildinfo.Commit=${{ steps.version.outputs.commit }} -X admindescargas/internal/buildinfo.Date=${{ steps.version.outputs.date }}"
          ls -la build/bin

      - name: Package .deb and AppImage
        if: runner.os == 'Linux'
        working-directory: cmd/adesc-desktop
        run: build/linux/package.sh "${{ steps.version.outputs.pkg }}" amd64

      - name: Package .dmg
        if: runner.os == 'macOS'
        working-directory: cmd/adesc-desktop
        run: |
          mkdir -p build/dist
          app=$(ls -d build/bin/*.app | head -n1)
          lipo -info "$app/Contents/MacOS/adesc-desktop"
          hdiutil create -volname AdminDescargas -srcfolder "$app" -ov -format UDZO build/dist/AdminDescargas.dmg

      - name: Smoke test (xvfb)
        if: runner.os == 'Linux'
        run: |
          tmp=$(mktemp -d)
          cat > "$tmp/config.toml" <<EOF
          data_dir = "$tmp/data"
          download_dir = "$tmp/downloads"

          [server]
          listen = "127.0.0.1:17979"
          token = "ci-smoke-token"

          [secrets]
          backend = "memory"
          EOF
          export ADESC_LOG_STDERR=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a dbus-run-session -- cmd/adesc-desktop/build/bin/adesc-desktop --config "$tmp/config.toml" >"$tmp/app.log" 2>&1 &
          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:17979/api/v1/health; then ok=1; break; fi
            sleep 1
          done
          echo
          if [ "$ok" = 1 ]; then
            # The instance file lets the CLI find the desktop app's API.
            cat "$tmp/data/instance.json"
            # The integrated core serves the real API: the bearer token is
            # required and accepted, also from the webview origin.
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ci-smoke-token" -H "Origin: wails://wails" http://127.0.0.1:17979/api/v1/stats)
            anon=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17979/api/v1/stats)
            echo "GET /api/v1/stats -> $code (without token: $anon)"
            [ "$code" = 200 ] && [ "$anon" = 401 ] || ok=0
          fi
          pkill -TERM -f build/bin/adesc-desktop || true
          sleep 3
          pkill -KILL -f build/bin/adesc-desktop || true
          echo "--- app log ---"
          cat "$tmp/app.log"
          [ "$ok" = 1 ]

      - uses: actions/upload-artifact@v4
        with:
          name: adesc-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            cmd/adesc-desktop/build/bin/*.exe
            cmd/adesc-desktop/build/dist/*.deb
            cmd/adesc-desktop/build/dist/*.AppImage
            cmd/adesc-desktop/build/dist/*.dmg
            cmd/adesc-desktop/build/bin/adesc-desktop
