# GoReleaser v2: daemon + CLI (adesc). The desktop app is built per OS by
# the CI desktop job (it needs cgo and cannot be cross-compiled).
version: 2

project_name: adesc

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"
    - go mod download

builds:
  - id: adesc
    main: ./cmd/adesc
    binary: adesc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X admindescargas/internal/buildinfo.Version={{ .Version }}
      - -X admindescargas/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X admindescargas/internal/buildinfo.Date={{ .Date }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

archives:
  - id: adesc
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - PLAN.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
